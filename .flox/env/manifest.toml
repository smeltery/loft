schema-version = "1.16.0"

[install]
bun.pkg-path = "bun"
git.pkg-path = "git"
git.outputs = "all"
gh.pkg-path = "gh"
pre-commit.pkg-path = "pre-commit"
pre-commit.outputs = "all"
actionlint.pkg-path = "actionlint"
shellcheck.pkg-path = "shellcheck"
shellcheck.outputs = "all"

[hook]
on-activate = '''
  git config core.hooksPath .githooks >/dev/null 2>&1 || true
  echo "loft — flox tools + bun $(bun --version 2>/dev/null || echo missing)"
'''

[options]
systems = ["aarch64-darwin", "x86_64-darwin", "aarch64-linux", "x86_64-linux"]
