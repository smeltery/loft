<!doctype html>
<!-- Source for apps/web/public/og.png. Render at 1200×630 on macOS to match the site typography. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>loft social preview</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; width: 1200px; height: 630px; overflow: hidden;
        background: #f5f5f5; color: #000;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .brand { position: absolute; top: 56px; left: 64px; display: flex; align-items: center; gap: 13px; }
      .brand img { width: 57px; height: 43px; transform: rotate(-8deg); }
      .brand span { font-size: 43px; font-weight: 600; letter-spacing: -2px; font-style: italic; }
      h1 { position: absolute; top: 171px; left: 64px; margin: 0; font-size: 72px; line-height: 1.04; font-weight: 600; letter-spacing: -3.5px; }
      .sub { position: absolute; top: 345px; left: 67px; margin: 0; font-size: 25px; line-height: 1.4; letter-spacing: -.65px; color: #666; }
      .sub em { color: #000; font-style: normal; background: linear-gradient(transparent 63%, #00000012 63%); }
      .pill { position: absolute; top: 499px; left: 64px; padding: 13px 22px; border-radius: 999px; font-size: 18px; letter-spacing: -.25px; background: #000; color: white; }
      .scene { position: absolute; top: 112px; left: 650px; width: 486px; }
      .window { border: 1px solid #00000014; border-radius: 22px; overflow: hidden; background: white; box-shadow: 0 24px 70px #00000012; }
      .toolbar { height: 63px; display: flex; align-items: center; padding: 0 21px; gap: 7px; border-bottom: 1px solid #0000000c; }
      .dot { width: 11px; height: 11px; border-radius: 50%; background: #d5d5d8; }
      .toolbar b { margin-left: 25px; font-size: 16px; letter-spacing: -.3px; font-weight: 600; }
      .toolbar .tools { margin-left: auto; color: #949497; font-size: 24px; letter-spacing: 5px; }
      .content { display: grid; grid-template-columns: 139px 1fr; min-height: 255px; }
      aside { background: #f2f2f4; padding: 24px 11px; font-size: 12px; color: #777; }
      aside .label { display: block; margin: 0 10px 9px; font-size: 10px; font-weight: 600; color: #929295; }
      aside .row { display: flex; align-items: center; gap: 7px; height: 29px; padding: 0 9px; border-radius: 6px; }
      aside .selected { background: #e1e1e5; color: #222; font-weight: 500; }
      aside img { width: 17px; height: 13px; }
      aside .location { margin-top: 22px; }
      .files { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px 9px; padding: 29px 16px 24px; }
      .file { text-align: center; font-size: 11px; color: #555; }
      .folder { position: relative; width: 58px; height: 43px; margin: 7px auto 10px; border-radius: 5px; background: linear-gradient(#dbdbdf, #bfbfc5); box-shadow: inset 0 0 0 1px #00000007, 0 2px 3px #00000006; }
      .folder:before { content: ""; position: absolute; top: -6px; left: 0; width: 25px; height: 10px; border-radius: 5px 5px 0 0; background: #d2d2d7; }
      .folder:after { content: ""; position: absolute; top: 5px; left: 0; right: 0; height: 1px; background: #ffffff5c; }
      .status { display: flex; justify-content: center; gap: 8px; align-items: center; height: 35px; border-top: 1px solid #0000000b; font-size: 10px; color: #8b8b90; }
      .status img { width: 12px; height: 9px; opacity: .55; }
      .space { display: flex; align-items: center; justify-content: space-between; gap: 18px; background: white; border: 1px solid #0000000a; border-radius: 16px; padding: 18px 24px; width: 418px; margin: 18px auto 0; box-shadow: 0 8px 24px #00000005; }
      .space strong { display: block; font-size: 22px; font-weight: 600; letter-spacing: -.6px; }
      .space span { display: block; font-size: 12px; color: #848484; margin-top: 3px; }
      .divider { height: 35px; width: 1px; background: #0000000d; }
    </style>
  </head>
  <body>
    <div class="brand"><img src="../../apps/web/public/brand/logo.svg" alt="" /><span>loft.</span></div>
    <h1>more space<br />for your mac.</h1>
    <p class="sub"><em>without</em> buying a new one.</p>
    <div class="pill">your cloud. right in finder.</div>
    <div class="scene">
      <div class="window">
        <div class="toolbar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><b>loft</b><span class="tools">‹ ›</span></div>
        <div class="content">
          <aside>
            <span class="label">Favorites</span>
            <div class="row">Recents</div><div class="row">Desktop</div><div class="row">Documents</div>
            <span class="label location">Locations</span>
            <div class="row selected"><img src="../../apps/web/public/brand/logo.svg" alt="" />loft</div>
          </aside>
          <div class="files">
            <div class="file"><div class="folder"></div>design</div>
            <div class="file"><div class="folder"></div>photos</div>
            <div class="file"><div class="folder"></div>projects</div>
            <div class="file"><div class="folder"></div>videos</div>
            <div class="file"><div class="folder"></div>work</div>
            <div class="file"><div class="folder"></div>everything</div>
          </div>
        </div>
        <div class="status"><img src="../../apps/web/public/brand/logo.svg" alt="" />all files up to date</div>
      </div>
      <div class="space"><div><strong>terabytes</strong><span>in the cloud</span></div><div class="divider"></div><div><strong>zero bytes</strong><span>on your mac</span></div></div>
    </div>
  </body>
</html>
