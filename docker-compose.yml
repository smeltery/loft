services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8787:8787"
    environment:
      LOFT_TOKEN: dev
      LOFT_DATA: /data
      PORT: "8787"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8787/health').then((r)=>r.ok||process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  loft-data:
